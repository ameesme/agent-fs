<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentFS</title>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
<script src="https://unpkg.com/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
<style>
:root { color-scheme: light dark; font: 15px/1.4 system-ui, sans-serif; }
body { margin: 0 auto; max-width: 60rem; padding: 0 1rem; }
nav ul { display: flex; flex-wrap: wrap; gap: .25rem 1rem; padding: 0; list-style: none; }
button { font: inherit; cursor: pointer; }
#messages { display: flex; flex-direction: column-reverse; height: 65vh; overflow-y: auto; border: 1px solid #8884; padding: .5rem; }
#messages p { margin: .25rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.user { align-self: flex-end; background: #8882; padding: .4rem .6rem; border-radius: .5rem; max-width: 80%; }
.tool, .note { opacity: .6; font-size: .85em; }
#messages details { margin: .25rem 0; }
#messages summary { cursor: pointer; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#messages details pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 20rem; overflow-y: auto; margin: .25rem 0 0 1rem; }
.error { color: #c33; }
select, form { margin: .5rem 0; }
form { display: flex; gap: .5rem; }
form input { flex: 1; font: inherit; padding: .4rem; }
.htmx-indicator { display: none; align-self: center; }
.htmx-request .htmx-indicator { display: inline; }
#files { display: grid; grid-template-columns: minmax(12rem, 1fr) 3fr; gap: 1rem; }
#files ul { list-style: none; padding: 0; margin: 0; }
#files li button { background: none; border: 0; padding: .1rem 0; text-align: left; color: LinkText; }
#file { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
@media (max-width: 40rem) { #files { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav hx-get="cgi-bin/ui?do=agents" hx-trigger="load"></nav>
<main id="view"><p>Pick an agent.</p></main>
</body>
</html>
