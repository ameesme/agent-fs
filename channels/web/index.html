<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shoebox</title>
<script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
<script src="https://unpkg.com/htmx-ext-json-enc@2.0.1/json-enc.js"></script>
<style>
:root { color-scheme: light dark; font: 16px/1.4 system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: Canvas; color: CanvasText; }
button, select, input, textarea { font: inherit; color: inherit; }
header { display: flex; border-bottom: 1px solid #8884; }
header button { flex: 1; padding: .75rem; border: 0; background: none; cursor: pointer; }
header button.on { font-weight: 600; box-shadow: inset 0 -2px currentColor; }
#view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#chat, #files { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.bar { display: flex; gap: .5rem; padding: .5rem; border-bottom: 1px solid #8884; }
.bar select, .send textarea { flex: 1; min-width: 0; min-height: 2.5rem; padding: 0 .6rem; border: 1px solid #8886; border-radius: .5rem; background: Field; color: FieldText; }
.send textarea { padding: .5rem .6rem; max-height: 10rem; resize: none; }
#messages { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column-reverse; padding: 0 .75rem; }
#messages p { margin: .3rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.user { align-self: flex-end; background: #8882; padding: .4rem .6rem; border-radius: .5rem; max-width: 85%; }
.tool, .note { opacity: .6; font-size: .85em; }
.error { color: #c33; }
#messages details { margin: .2rem 0; }
#messages summary { cursor: pointer; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#messages details pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 20rem; overflow-y: auto; margin: .25rem 0 0 1rem; }
.send, .bottom { display: flex; align-items: center; justify-content: flex-end; gap: .5rem; margin: 0; padding: .5rem .5rem max(.5rem, env(safe-area-inset-bottom)); border-top: 1px solid #8884; }
.send { align-items: flex-end; }
.send button, .button { display: inline-flex; align-items: center; min-height: 2.5rem; padding: 0 1rem; border: 1px solid #8886; border-radius: .5rem; background: #8882; color: inherit; text-decoration: none; cursor: pointer; white-space: nowrap; }
.icon { width: 2.5rem; padding: 0; justify-content: center; }
.send button:disabled, .button:disabled, .button:has(input:disabled) { opacity: .4; cursor: not-allowed; }
/* While a reply runs the send button shows a stop square, or a spinner when it cannot be stopped. */
.send button { position: relative; }
.send[data-state] button { color: transparent; }
.send[data-state] button::after { content: ''; position: absolute; inset: 0; margin: auto; width: .75rem; height: .75rem; border-radius: 2px; background: CanvasText; }
.send[data-state=wait] button { opacity: 1; cursor: progress; }
.send[data-state=wait] button::after { width: 1rem; height: 1rem; border: 2px solid CanvasText; border-right-color: transparent; border-radius: 50%; background: none; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
#busy { display: none; gap: .3rem; padding: .25rem .75rem .5rem; }
#busy.htmx-request { display: flex; }
#busy span { width: .5rem; height: .5rem; border-radius: 50%; background: currentColor; opacity: .25; animation: pulse 1s infinite; }
#busy span:nth-child(2) { animation-delay: .2s; }
#busy span:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 50% { opacity: .8; } }
.list { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0; }
.tree, .tree ul { margin: 0; padding: .25rem; list-style: none; }
.tree ul { padding: 0 0 0 1rem; }
.tree summary, .tree a { display: flex; align-items: center; gap: .5rem; min-height: 2.5rem; padding: 0 .5rem; border-radius: .4rem; color: inherit; text-decoration: none; cursor: pointer; list-style: none; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary::before, .tree a::before { content: ''; flex: none; width: .75rem; opacity: .6; }
.tree summary::before { content: '▸'; }
.tree details[open] > summary::before { content: '▾'; }
.tree summary:hover, .tree a:hover { background: #8881; }
.tree .selected { background: #8882; }
.name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.size { opacity: .6; font-size: .85em; white-space: nowrap; }
#target { flex: 1; min-width: 0; opacity: .6; font-size: .85em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#sheet { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; background: Canvas; }
#sheet:empty { display: none; }
@media (min-width: 48rem) {
  #files { display: grid; grid-template-columns: 20rem minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .tree { grid-area: 1 / 1; }
  #files > .bottom { grid-area: 2 / 1; }
  #sheet, #sheet:empty { position: static; grid-area: 1 / 2 / 3; display: flex; border-left: 1px solid #8884; }
  #sheet:empty::before { content: 'Select a file'; margin: auto; opacity: .5; }
}
.path { flex: 1; min-width: 0; align-self: center; overflow-wrap: anywhere; }
.file { margin: 0; padding: .75rem; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
<script>
const encode = text => btoa(String.fromCharCode(...new TextEncoder().encode(text))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function load() {
  const [view, ...rest] = decodeURIComponent(location.hash.slice(1)).split('/');
  const sheet = document.getElementById('sheet');
  if (view === 'files' && sheet) {
    if (!rest.length) return sheet.replaceChildren();
    return htmx.ajax('GET', `cgi-bin/ui?do=file&p=${encode(rest.join('/'))}`, sheet);
  }
  const url = view === 'files' ? `cgi-bin/ui?do=open&p=${encode(rest.join('/'))}` : `cgi-bin/ui?do=chat&a=${rest[0] || ''}&c=${rest[1] || ''}`;
  htmx.ajax('GET', url, '#view');
}
// Mirror the open view in the address bar so refresh and back return to it.
function remember() {
  const hash = [...document.querySelectorAll('#view [data-hash]')].pop()?.dataset.hash;
  if (!hash) return;
  document.querySelectorAll('header button').forEach(button => button.classList.toggle('on', hash.startsWith(button.textContent.toLowerCase())));
  if (decodeURIComponent(location.hash.slice(1)) === hash) return;
  history[location.hash ? 'pushState' : 'replaceState'](null, '', '#' + encodeURI(hash));
}
addEventListener('DOMContentLoaded', load);
addEventListener('popstate', load);
document.addEventListener('htmx:afterSettle', remember);
// Grow the message box with its text, up to the max-height in CSS.
function resize(input) {
  input.style.height = 'auto';
  input.style.height = input.scrollHeight + 2 + 'px';
}
// Enter sends, Shift+Enter adds a line.
document.addEventListener('keydown', event => {
  const input = event.target.closest?.('.send textarea');
  if (!input || event.key !== 'Enter' || event.shiftKey || event.isComposing) return;
  event.preventDefault();
  if (!input.form.dataset.state) input.form.requestSubmit();
});
document.addEventListener('input', event => event.target.matches('.send textarea') && resize(event.target));
// Show a sent message right away; the next render of the session replaces it.
function sending(form) {
  const input = form.elements.text, text = input.value, messages = document.getElementById('messages');
  form.reset();
  resize(input);
  busy(form, text.startsWith('/') ? 'wait' : 'stop');
  if (text.startsWith('/') || !messages) return;
  const p = document.createElement('p');
  p.className = 'user';
  p.textContent = text;
  messages.prepend(p);
  messages.scrollTop = 0;
}
// Commands only wait; a message reply can be stopped until the stop is sent.
function busy(form, state) {
  const button = form.querySelector('button');
  if (state) form.dataset.state = state; else delete form.dataset.state;
  button.disabled = state === 'wait';
  button.title = { stop: 'Stop', wait: 'Waiting…' }[state] || '';
  button.setAttribute('aria-label', button.title || 'Send');
}
document.addEventListener('htmx:afterRequest', event => event.target.matches?.('.send') && busy(event.target));
document.addEventListener('click', event => {
  const form = event.target.closest?.('.send[data-state]');
  if (!form || !event.target.closest('button')) return;
  event.preventDefault();
  if (form.dataset.state !== 'stop') return;
  busy(form, 'wait');
  fetch(form.getAttribute('hx-post').replace('do=send', 'do=stop'), { method: 'POST' })
    .then(response => response.ok || response.text().then(alert));
});
// Keep what was typed when the chat re-renders, and skip polled refreshes while text is selected.
let draft;
document.addEventListener('htmx:beforeSwap', event => {
  const selection = getSelection();
  if (event.target.id === 'messages' && event.detail.target.id === 'messages' && !selection.isCollapsed && event.detail.target.contains(selection.anchorNode)) {
    event.detail.shouldSwap = false;
    return;
  }
  const input = document.querySelector('.send textarea');
  draft = event.detail.target.id === 'chat' && input ? { text: input.value, focused: input === document.activeElement } : null;
});
document.addEventListener('htmx:afterSwap', () => {
  const input = document.querySelector('.send textarea');
  if (!draft || !input) return;
  input.value = draft.text;
  resize(input);
  if (draft.focused) input.focus();
});
let folder;
document.addEventListener('click', event => {
  const summary = event.target.closest('.tree summary');
  if (!summary) return;
  document.querySelector('.tree .selected')?.classList.remove('selected');
  summary.classList.add('selected');
  folder = summary.dataset.dir;
  document.querySelectorAll('#files .bottom :disabled').forEach(control => control.disabled = false);
  document.getElementById('target').textContent = summary.dataset.path;
});
function refresh(token) {
  const list = document.getElementById('t-' + token);
  if (list) htmx.ajax('GET', `cgi-bin/ui?do=tree&p=${token}`, list);
}
// Send the raw file as the body; the shell can store that without parsing multipart forms.
function upload(input) {
  const file = input.files[0];
  if (!file) return;
  create('upload', file.name, file);
  input.value = '';
}
function makeFolder() {
  const name = prompt('Folder name');
  if (name) create('mkdir', name);
}
function create(action, name, body) {
  const target = folder;
  fetch(`cgi-bin/ui?do=${action}&p=${target}&n=${encode(name)}`, { method: 'POST', body })
    .then(response => response.ok ? refresh(target) : response.text().then(alert));
}
document.addEventListener('htmx:responseError', event => alert(event.detail.xhr.responseText));
</script>
</head>
<body>
<header>
<button hx-get="cgi-bin/ui?do=chat" hx-target="#view">Chat</button>
<button hx-get="cgi-bin/ui?do=open" hx-target="#view">Files</button>
</header>
<main id="view"></main>
</body>
</html>
