services:
  agents:
    build: .
    privileged: true
    command: ${CHANNEL_COMMAND:-}
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - agents-data:/data
      - ./data/agents:/data/agents
      - ./data/shared:/data/shared

volumes:
  agents-data:
