name: shoebox
version: "0.4.0"
slug: shoebox
description: Filesystem-based orchestration for AI agents
url: https://github.com/ameesme/shoebox
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: experimental
ingress: true
ingress_port: 8080
panel_icon: mdi:robot
panel_title: shoebox
# Device access and Linux capabilities are separate Supervisor settings.
full_access: true
apparmor: false
privileged:
  - SYS_ADMIN
  - NET_ADMIN
  - SYS_RESOURCE
  - MKNOD
  - NET_RAW
  - SETFCAP
  - SYS_PTRACE
options:
  environment: []
  telegram_bot_token: ""
  telegram_chat_ids: ""
schema:
  environment:
    - name: match(^[A-Za-z_][A-Za-z0-9_]*$)
      value: password
  telegram_bot_token: password
  telegram_chat_ids: str
